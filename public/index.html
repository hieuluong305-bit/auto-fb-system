<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Auto FB Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-emerald-700">🚀 Hệ Thống Auto FB & AI Marketing</h1>
    
    <!-- 1. Cấu hình Page -->
    <div class="bg-white p-5 rounded-lg shadow">
      <h2 class="font-bold mb-3">1. Kết Nối Fanpage</h2>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <input id="pg-id" placeholder="Page ID" class="border p-2 rounded">
        <input id="pg-name" placeholder="Tên Page" class="border p-2 rounded">
        <input id="pg-token" placeholder="Page Access Token" class="border p-2 rounded col-span-2">
        <input id="pg-chat" placeholder="Telegram Chat ID" class="border p-2 rounded col-span-2">
      </div>
      <button onclick="savePage()" class="bg-black text-white px-4 py-2 rounded">Lưu Fanpage</button>
    </div>

    <!-- 2. AI Content & Đăng bài -->
    <div class="bg-white p-5 rounded-lg shadow">
      <h2 class="font-bold mb-3">2. Trợ Lý AI & Xuất Bản Đa Page</h2>
      <div class="flex gap-2 mb-3">
        <input id="ai-product" placeholder="Tên sản phẩm..." class="flex-1 border p-2 rounded">
        <select id="ai-framework" class="border p-2 rounded">
          <option value="AIDA">AIDA</option>
          <option value="PAS">PAS</option>
        </select>
        <button onclick="generateAI()" class="bg-emerald-600 text-white px-4 py-2 rounded">Tạo Bài AI</button>
      </div>
      <textarea id="post-content" rows="4" class="w-full border p-2 rounded mb-3" placeholder="Nội dung bài viết..."></textarea>
      <input id="post-media" placeholder="Link ảnh hoặc link video..." class="w-full border p-2 rounded mb-3">
      <label class="flex items-center gap-2 mb-3">
        <input type="checkbox" id="post-is-reels"> Đăng dạng Video Reels
      </label>
      <div id="page-list" class="flex gap-4 mb-4"></div>
      <button onclick="publishPost()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded">Đăng Lên Toàn Bộ Fanpage</button>
    </div>

    <!-- 3. Bảng SĐT ẩn -->
    <div class="bg-white p-5 rounded-lg shadow">
      <h2 class="font-bold mb-3">3. Số Điện Thoại Đã Tự Động Ẩn (&lt; 1s)</h2>
      <table class="w-full text-left">
        <thead><tr class="border-b"><th class="pb-2">Page</th><th class="pb-2">SĐT</th><th class="pb-2">Bình luận</th></tr></thead>
        <tbody id="lead-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadPages() {
      const res = await fetch('/api/pages');
      const pages = await res.json();
      document.getElementById('page-list').innerHTML = pages.map(p => `
        <label><input type="checkbox" value="${p.id}" class="pg-item"> ${p.name}</label>
      `).join('') || 'Chưa có Page nào.';
    }
    async function savePage() {
      await fetch('/api/pages', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          id: document.getElementById('pg-id').value,
          name: document.getElementById('pg-name').value,
          access_token: document.getElementById('pg-token').value,
          telegram_chat_id: document.getElementById('pg-chat').value
        })
      });
      alert('Đã lưu Page!');
      loadPages();
    }
    async function generateAI() {
      const res = await fetch('/api/ai/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          product: document.getElementById('ai-product').value,
          framework: document.getElementById('ai-framework').value
        })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      document.getElementById('post-content').value = data.content;
    }
    async function publishPost() {
      const selected = Array.from(document.querySelectorAll('.pg-item:checked')).map(c => c.value);
      if(!selected.length) return alert('Hãy chọn ít nhất 1 Page!');
      await fetch('/api/posts/publish', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          pageIds: selected,
          content: document.getElementById('post-content').value,
          mediaUrl: document.getElementById('post-media').value,
          isReels: document.getElementById('post-is-reels').checked
        })
      });
      alert('Đã đưa vào hàng đợi đăng bài!');
    }
    async function loadLeads() {
      const res = await fetch('/api/leads');
      const leads = await res.json();
      document.getElementById('lead-list').innerHTML = leads.map(l => `
        <tr class="border-b"><td class="py-2">${l.page_name}</td><td class="text-emerald-600 font-bold">${l.phone}</td><td>${l.comment_text}</td></tr>
      `).join('');
    }
    loadPages();
    loadLeads();
    setInterval(loadLeads, 5000);
  </script>
</body>
</html>
